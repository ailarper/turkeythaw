<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TurkeyThaw — UI Taqdimot & Reja</title>
  <link rel="icon" href="./public/icon.svg" type="image/svg+xml">
  <meta name="theme-color" content="#FCFAF6">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html {
      scroll-behavior: smooth;
      background-color: #FCFAF6;
    }
    body {
      min-height: 100vh;
      background-color: #FCFAF6;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: #111111;
      display: flex;
      flex-direction: column;
      align-items: center;
      overflow-x: hidden;
    }
    main {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    section {
      position: relative;
      width: 100%;
      max-width: 1440px;
    }
    section img {
      width: 100%;
      height: auto;
      display: block;
      user-select: none;
      -webkit-user-drag: none;
      pointer-events: none;
    }
    .hotspot {
      position: absolute;
      z-index: 9999;
      cursor: pointer;
      background: transparent;
      border: none;
      outline: none;
      display: block;
      transition: background 0.2s ease;
    }
    .hotspot:hover {
      background: rgba(234, 88, 12, 0.05);
      border-radius: 9999px;
    }
  </style>
</head>
<body>

  <main>
    <!-- 1. PLANNER -->
    <section id="planner">
      <img src="./public/assets/planner.png" alt="Planner" onerror="this.src='./assets/planner.png';">

      <!-- Start Backwards Planning tugmasi -->
      <button
        type="button"
        class="hotspot"
        onclick="document.getElementById('dashboard').scrollIntoView({ behavior: 'smooth' })"
        style="left: 30%; top: 64%; width: 40%; height: 12%;"
        aria-label="Start Planning"
      ></button>

      <!-- Navbar: Plan dinner tugmasi -->
      <button
        type="button"
        class="hotspot"
        onclick="document.getElementById('dashboard').scrollIntoView({ behavior: 'smooth' })"
        style="right: 2%; top: 2%; width: 14%; height: 8%;"
        aria-label="Plan dinner"
      ></button>
    </section>

    <!-- 2. DASHBOARD -->
    <section id="dashboard">
      <img src="./public/assets/dashboard.png" alt="Dashboard" onerror="this.src='./assets/dashboard.png';">

      <!-- + Add to Calendar -->
      <a
        href="https://calendar.google.com"
        target="_blank"
        rel="noopener noreferrer"
        class="hotspot"
        style="left: 40%; bottom: 10%; width: 20%; height: 10%;"
        aria-label="Add to Calendar"
      ></a>
    </section>

    <!-- 3. GUIDE -->
    <section id="guide">
      <img src="./public/assets/guide.png" alt="Guide" onerror="this.src='./assets/guide.png';">
    </section>

    <!-- 4. TIMELINE -->
    <section id="timeline">
      <img src="./public/assets/timeline.png" alt="Timeline" onerror="this.src='./assets/timeline.png';">

      <!-- Back to top -->
      <button
        type="button"
        class="hotspot"
        onclick="window.scrollTo({ top: 0, behavior: 'smooth' })"
        style="right: 2%; bottom: 2%; width: 12%; height: 8%;"
        aria-label="Back to top"
      ></button>
    </section>
  </main>

</body>
</html>
